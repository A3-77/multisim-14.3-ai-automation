<text x="24.0" y="30.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="15" fill="#0f172a" font-weight="600" text-anchor="start" >v0.10.0 · 同一节点 2 个到地元件：C1(159.155nF) ∥ R2(1kΩ)</text>
<text x="24.0" y="50.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="11.5" fill="#64748b" font-weight="400" text-anchor="start" >V1 1V/1kHz → R1 1kΩ → n1，n1 上 C1 与 R2 一起下地。实测增益 0.44690（理论 0.44721，−0.07%），相位 −26.65°（理论 −26.57°）</text>
<text x="24.0" y="68.0" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="11.5" fill="#b45309" font-weight="400" text-anchor="start" >反证：如果只有 C1 在网表里，增益会是 0.7071；只有 R2 则是 0.5000。实测 0.4469 只可能来自两者并联</text>
